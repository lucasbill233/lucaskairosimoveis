<style>
:root{--bg:#1f2420;--card:#2a302a;--line:#414a40;--fg:#f1eee6;--mute:#b5b8aa;--gold:#d9a25a;--wa:#25d366;color-scheme:dark;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:400 16px/1.6 "Jost","Avenir Next","Segoe UI",system-ui,sans-serif}
.wrap{max-width:860px;margin:0 auto;padding:40px max(16px,env(safe-area-inset-right,0px)) 56px max(16px,env(safe-area-inset-left,0px));display:grid;gap:28px}
h1,h2{font-family:"Marcellus",Georgia,serif;font-weight:400;margin:0;line-height:1.15}
h1{font-size:clamp(2rem,7vw,2.8rem)}
.eyebrow{font-size:.74rem;letter-spacing:.22em;text-transform:uppercase;color:var(--gold)}
.mute{color:var(--mute);margin:0}
.grid{display:grid;gap:16px}@media(min-width:640px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
a.card{display:grid;text-decoration:none;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
a.card img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block}
a.card .t{padding:14px 16px;display:grid;gap:2px}a.card .t b{font-family:"Marcellus",Georgia,serif;font-weight:400;font-size:1.35rem}
a.card .t span{color:var(--mute);font-size:.9rem}
.btn{display:inline-flex;justify-self:start;align-items:center;gap:8px;border-radius:999px;padding:12px 18px;background:var(--wa);color:#08260f;font-weight:500;text-decoration:none}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
</style>
</head>
<body>
<main class="wrap">
  <div style="display:grid;gap:8px">
    <span class="eyebrow">Kairós Negócios Imobiliários</span>
    <h1>Lucas</h1>
    <p class="mute">Corretor em Ribeirão Preto · CRECI 190.339-F</p>
  </div>
  <p style="margin:0;max-width:52ch">Lançamentos e imóveis prontos em Ribeirão Preto. Me chama no WhatsApp que eu te mando as opções que fazem sentido para você.</p>

</main>
</body>
